name: Hourly AI Prompt Generator

on:
  schedule:
    - cron: '7 * * * *'   # every hour at :07 (avoids GitHub's high-load :00 delays/skips)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab to test
  repository_dispatch:
    types: [external-trigger]   # lets an external free service (cron-job.org) force-run this as a backup

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate prompt and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python generate_and_post.py

      - name: Commit updated state file (repetition memory)
        run: |
          git config user.name "prompt-bot"
          git config user.email "prompt-bot@users.noreply.github.com"
          git add state/recent_prompts.json
          git diff --cached --quiet || git commit -m "Update recent-prompts state [skip ci]"
          git push
